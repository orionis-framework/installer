[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "orionis-installer"
version = "0.1.0"
description = "Create Orionis applications with isolated Python environments."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENCE"]
dependencies = [
    "typer>=0.27.3,<0.28",
    "rich>=15.0.0,<16",
    "prompt-toolkit>=3.0.53,<4",
    "tomlkit>=0.15.1,<0.16",
    "packaging>=26.3,<27",
    "python-dotenv>=1.2.4,<2",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.scripts]
orionis = "orionis_installer.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.10,<0.17",
    "mypy>=2.4,<3",
    "build>=1.6.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orionis_installer = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["smoke: real uv/network test enabled only with ORIONIS_REAL_SMOKE=1"]

[tool.mypy]
python_version = "3.14"
files = ["src/orionis_installer"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

