name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NO_COLOR: "1"
      UV_NO_PROGRESS: "1"
      ORIONIS_REAL_SMOKE: "0"
    steps:
      # Official revisions in uv's GitHub guide, inspected 2026-10-06.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Sync development environment
        run: uv sync --locked --python 3.14
      - name: Ruff and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Static types
        run: uv run --no-sync mypy
      - name: Offline and unit tests
        run: uv run --no-sync pytest --cov=orionis_installer --cov-report=term-missing --cov-report=xml
      - name: Build wheel and source distribution
        run: uv build
      - name: Clean wheel environment and entry point
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile

          wheel, = pathlib.Path("dist").glob("*.whl")
          with tempfile.TemporaryDirectory(prefix="orionis-wheel-") as temporary:
              environment = pathlib.Path(temporary) / "clean"
              subprocess.run(["uv", "venv", str(environment), "--python", "3.14"], check=True)
              scripts = environment / ("Scripts" if os.name == "nt" else "bin")
              python = scripts / ("python.exe" if os.name == "nt" else "python")
              entry = scripts / ("orionis.exe" if os.name == "nt" else "orionis")
              subprocess.run(["uv", "pip", "install", "--python", str(python), str(wheel.resolve())], check=True)
              for arguments in (["--version"], ["--help"], ["new", "--help"]):
                  subprocess.run([str(entry), *arguments], cwd=temporary, check=True)
              subprocess.run(["uvx", "--python", "3.14", "--from", str(wheel.resolve()), "orionis", "--version"], cwd=temporary, check=True)
          PY
